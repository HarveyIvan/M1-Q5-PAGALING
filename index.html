<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M1 Q5 - PAGALING</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <canvas id="sceneCanvas" aria-label="Five animated 3D geometries: box, cone, cylinder, sphere, and torus"></canvas>
  <header class="heading">
    <p class="eyebrow">MY FIRST THREE.JS SCENE</p>
    <h1>M1 Q5 - PAGALING</h1>
    <p class="subtitle">Five shapes. Five colors. One scene.</p>
  </header>
  <button id="animationToggle" type="button" aria-pressed="false">Pause animation</button>
  <ul class="legend" aria-label="Geometry colors">
    <li><span class="swatch box"></span>Box</li>
    <li><span class="swatch cone"></span>Cone</li>
    <li><span class="swatch cylinder"></span>Cylinder</li>
    <li><span class="swatch sphere"></span>Sphere</li>
    <li><span class="swatch torus"></span>Torus</li>
  </ul>
  <p id="errorMessage" role="alert" hidden></p>
</body>
</html>
